# This file extends Detekt's built-in rule set. It enforces the Android Studio
# code style used by Google's Android Kotlin style guide, while allowing the
# standard UpperCamelCase convention for Jetpack Compose functions.
config:
  validation: true
  warningsAsErrors: true

# The KtLint wrapper is supplied by detekt-rules-ktlint-wrapper. Keeping
# autoCorrect off makes CI report violations without changing checked-out code.
ktlint:
  active: true
  code_style: android_studio
  autoCorrect: false
  MaximumLineLength:
    active: true
    maxLineLength: 100
  PackageName:
    active: false

naming:
  FunctionNaming:
    # Compose functions conventionally use UpperCamelCase; other functions use
    # lowerCamelCase as prescribed by the Google Kotlin style guide.
    functionPattern: '([a-z][a-zA-Z0-9]*)|([A-Z][a-zA-Z0-9]*)'
  ObjectPropertyNaming:
    constantPattern: '[A-Z][A-Z0-9_]*'
    propertyPattern: '[a-z][A-Za-z0-9]*'
    privatePropertyPattern: '(_)?[a-z][A-Za-z0-9]*'
  PackageNaming:
    active: false
    packagePattern: '[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)*'
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Z0-9_]*'
    propertyPattern: '[a-z][A-Za-z0-9]*'
    privatePropertyPattern: '_?[a-z][A-Za-z0-9]*'

style:
  # These rules overlap with the KtLint rules above. KtLint is used because it
  # also verifies the Google/Android import, whitespace, and wrapping rules.
  MaxLineLength:
    active: false
  NewLineAtEndOfFile:
    active: false
  WildcardImport:
    active: false
  ExpressionBodySyntax:
    active: false
